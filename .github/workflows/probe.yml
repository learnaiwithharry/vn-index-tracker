name: Probe data sources
on:
  push:
    branches: [probe-data-sources]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pandas && (pip install -q vnstock || pip install -q git+https://github.com/thinh-vu/vnstock || echo 'vnstock unavailable')
      - run: python tools/probe.py
